name: Build AURORA IPTV APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

# Keep one release build per ref, but never make a main release wait for PR emulation.
# All builds restore the same existing signing key; no replacement keys are generated.
concurrency:
  group: aurora-iptv-apk-build-mediafix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Keep the test signing key in a repository-scoped Actions cache.
      # The file is generated once and then restored for every later build.
      - name: Restore persistent test signing key
        uses: actions/cache/restore@v4
        with:
          path: .signing/aurora-debug.keystore
          key: aurora-test-signing-key-v2

      - name: Recover signing key from secret if needed
        env:
          AURORA_KEYSTORE_BASE64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .signing
          if [ ! -f .signing/aurora-debug.keystore ]; then
            python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = os.environ.get('AURORA_KEYSTORE_BASE64', '')
          if not key:
              raise SystemExit('Signing key unavailable. Restore the original key or configure AURORA_KEYSTORE_BASE64; never generate a replacement for online updates.')
          Path('.signing/aurora-debug.keystore').write_bytes(base64.b64decode(key, validate=True))
          PY
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Compilation, original signing identity and update metadata are validated before QA.
      - name: Compile Android APK
        run: gradle --no-daemon assembleDebug

      - name: Save persistent test signing key
        uses: actions/cache/save@v4
        with:
          path: .signing/aurora-debug.keystore
          key: aurora-test-signing-key-v2

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/aurora-iptv.apk

      - name: Verify signature and prepare online update
        run: python3 release/prepare_android.py app/build/outputs/apk/debug/aurora-iptv.apk app/build/outputs/apk/debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-iptv-apk
          path: |
            app/build/outputs/apk/debug/aurora-iptv.apk
            app/build/outputs/apk/debug/aurora-update.json
            app/build/outputs/apk/debug/aurora-iptv.apk.sha256
          if-no-files-found: error
          retention-days: 14


  # Every verification gates publication, including manual workflow dispatch.
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore persistent test signing key
        uses: actions/cache/restore@v4
        with:
          path: .signing/aurora-debug.keystore
          key: aurora-test-signing-key-v2
      - name: Recover signing key from secret if needed
        env:
          AURORA_KEYSTORE_BASE64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .signing
          if [ ! -f .signing/aurora-debug.keystore ]; then
            python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('AURORA_KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Original signing key unavailable for QA.')
          Path('.signing/aurora-debug.keystore').write_bytes(base64.b64decode(value, validate=True))
          PY
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests, lint and compile UI tests
        run: gradle --no-daemon testDebugUnitTest lintDebug compileDebugAndroidTestKotlin
      - name: Test Android release metadata
        run: python3 -m unittest discover -s release -p 'test_*.py'
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm

      - name: Install media fixture tools
        run: |
          # Most hosted runners already include ffmpeg. Avoid lengthy apt update
          # when the command is available and keep media playback tests enabled.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 update
            timeout 180s sudo apt-get -o Acquire::Retries=2 install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -hide_banner -version

      - name: Check navigation, persistence and actual video playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash test/run-android-checks.sh

      - name: Upload UI verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-ui-verification
          path: |
            app/build/aurora-ui
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          retention-days: 14

  publish:
    needs: [build, verify]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aurora-iptv-apk
          path: dist
      - name: Publish complete Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/publish_android.py
