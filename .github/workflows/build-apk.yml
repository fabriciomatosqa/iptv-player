name: Build AURORA IPTV APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

# Avoid two builds generating different signing keys at the same time.
concurrency:
  group: aurora-iptv-apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Keep the test signing key in a repository-scoped Actions cache.
      # The file is generated once and then restored for every later build.
      - name: Restore persistent test signing key
        uses: actions/cache/restore@v4
        with:
          path: .signing/aurora-debug.keystore
          key: aurora-test-signing-key-v2

      - name: Create test signing key if missing
        run: |
          mkdir -p .signing
          if [ ! -f .signing/aurora-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore .signing/aurora-debug.keystore \
              -storepass auroraTestKey123 \
              -alias aurora \
              -keypass auroraTestKey123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AURORA IPTV Test, OU=Development, O=AURORA IPTV, L=Divinopolis, ST=MG, C=BR"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Save persistent test signing key
        uses: actions/cache/save@v4
        with:
          path: .signing/aurora-debug.keystore
          key: aurora-test-signing-key-v2

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/aurora-iptv.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-iptv-apk
          path: app/build/outputs/apk/debug/aurora-iptv.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable emulator acceleration
        if: github.event_name == 'pull_request'
        run: |
          sudo chmod 666 /dev/kvm

      - name: Check navigation, persistence and actual video playback
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/br.com.fabriciomatos.iptvplayer/files/ui-checks app/build/aurora-ui

      - name: Upload UI verification
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-ui-verification
          path: |
            app/build/aurora-ui
            app/build/reports/androidTests
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          retention-days: 14
