name: Build AURORA IPTV APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

# Avoid two builds generating different signing keys at the same time.
concurrency:
  group: aurora-iptv-apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Keep the test signing key in a repository-scoped Actions cache.
      # The file is generated once and then restored for every later build.
      - name: Restore persistent test signing key
        uses: actions/cache/restore@v4
        with:
          path: .signing/aurora-debug.keystore
          key: aurora-test-signing-key-v2

      - name: Recover signing key from secret if needed
        env:
          AURORA_KEYSTORE_BASE64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .signing
          if [ ! -f .signing/aurora-debug.keystore ]; then
            python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = os.environ.get('AURORA_KEYSTORE_BASE64', '')
          if not key:
              raise SystemExit('Signing key unavailable. Restore the original key or configure AURORA_KEYSTORE_BASE64; never generate a replacement for online updates.')
          Path('.signing/aurora-debug.keystore').write_bytes(base64.b64decode(key, validate=True))
          PY
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug compileDebugAndroidTestKotlin

      - name: Test Android release metadata
        run: python3 -m unittest discover -s release -p 'test_*.py'

      - name: Save persistent test signing key
        uses: actions/cache/save@v4
        with:
          path: .signing/aurora-debug.keystore
          key: aurora-test-signing-key-v2

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/aurora-iptv.apk

      - name: Verify signature and prepare online update
        run: python3 release/prepare_android.py app/build/outputs/apk/debug/aurora-iptv.apk app/build/outputs/apk/debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-iptv-apk
          path: |
            app/build/outputs/apk/debug/aurora-iptv.apk
            app/build/outputs/apk/debug/aurora-update.json
            app/build/outputs/apk/debug/aurora-iptv.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Enable emulator acceleration
        if: github.event_name == 'pull_request'
        run: |
          sudo chmod 666 /dev/kvm

      - name: Install media fixture tools
        if: github.event_name == 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Check navigation, persistence and actual video playback
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash test/run-android-checks.sh

      - name: Upload UI verification
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-ui-verification
          path: |
            app/build/aurora-ui
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          retention-days: 14

  publish:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aurora-iptv-apk
          path: dist
      - name: Publish complete Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/publish_android.py
